name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: pip install '.[dev]'
      - name: Lint (ruff)
        run: ruff check anonproxy tests scripts/benchmark_roundtrip.py
      - name: Tests
        run: python -m pytest -q
