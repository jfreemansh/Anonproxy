name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Wheel must carry every base dependency
        run: |
          python - <<'PY'
          import zipfile, glob, re
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read(
              [n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]
          ).decode()
          reqs = [l.split("Requires-Dist: ")[1].split(";")[0].split("[")[0].strip()
                  for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          names = {r.lower() for r in reqs}
          assert {"fastapi", "uvicorn", "httpx", "cryptography"} <= names, names
          print("wheel deps:", sorted(names))
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
# One-time setup on pypi.org: project -> Publishing -> add a "Trusted
# Publisher" for this repo + this workflow filename. Until then this job
# fails at the Publish step; everything else (macOS app release) is unaffected.
