name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Wheel must carry every base dependency
        run: |
          python - <<'PY'
          import glob, tomllib, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read(
              [n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]
          ).decode()

          def norm(req):
              for i, ch in enumerate(req):
                  if ch in "<>=!~;[ ":
                      return req[:i].strip().lower()
              return req.strip().lower()

          # base deps only — extras (dev/torch/ruff) are optional by design
          wheel_names = {norm(l.split("Requires-Dist: ")[1])
                         for l in meta.splitlines()
                         if l.startswith("Requires-Dist:")
                         and "extra ==" not in l}
          py = tomllib.load(open("pyproject.toml", "rb"))
          required = {norm(d) for d in py["project"]["dependencies"]}
          missing = required - wheel_names
          assert not missing, f"wheel missing base deps: {sorted(missing)}"
          print("wheel carries all", len(required), "base deps")
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
# One-time setup on pypi.org: project -> Publishing -> add a "Trusted
# Publisher" for this repo + this workflow filename. Until then this job
# fails at the Publish step; everything else (macOS app release) is unaffected.
