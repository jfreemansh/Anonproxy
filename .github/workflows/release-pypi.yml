name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
# One-time setup on pypi.org: project -> Publishing -> add a "Trusted
# Publisher" for this repo + this workflow filename. Until then this job
# fails at the Publish step; everything else (macOS app release) is unaffected.
