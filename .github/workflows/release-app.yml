name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      # Both arches build on macos-14: the Swift side is cross-compiled and
      # foreign-arch deps arrive as prebuilt wheels (no Intel runner needed).
      matrix:
        include:
          - { os: macos-14, arch: arm64,  pbsarch: aarch64-apple-darwin }
          - { os: macos-14, arch: x86_64, pbsarch: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch embedded Python runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/astral-sh/python-build-standalone/releases/latest \
                --jq '.assets[].browser_download_url' \
                | grep "cpython-3.12.*${{ matrix.pbsarch }}-install_only.tar.gz" | head -1)
          echo "runtime: $URL"
          mkdir -p /tmp/pbs && curl -sL "$URL" | tar xz -C /tmp/pbs

      - name: Assemble Anonbar.app (${{ matrix.arch }})
        run: scripts/build_app.sh
        env:
          RUNTIME_DIR: /tmp/pbs/python

      - name: Zip + checksum
        run: |
          # 'x86_64' alone gets misread as Windows; spell out macOS + Intel
          NAME="Anonbar-macos-${{ matrix.arch == 'arm64' && 'arm64' || 'intel' }}"
          cd build
          ditto -c -k --keepParent Anonbar.app "$NAME.zip"
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"
          echo "ZIPNAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: build/Anonbar-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "Anonbar-*", merge-multiple: true, path: rel }
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
